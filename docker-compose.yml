services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build: ./data-pipeline
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    # Runs the hourly ingest in a loop; replace with a proper scheduler later if needed
    command: ["python", "-m", "brweather_data.jobs.scheduler"]

volumes:
  pgdata:
